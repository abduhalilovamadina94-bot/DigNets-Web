name: DigNets Web — GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Kalitlarni tekshirish
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ]; then echo "::error::TG_API_ID va TG_API_HASH secrets qo'shilmagan"; exit 1; fi
      - run: npx -y npm@11 ci --no-audit --no-fund
      - name: Yig'ish
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          APP_ENV: production
          BASE_URL: https://abduhalilovamadina94-bot.github.io/DigNets-Web/
        run: npx vite build
      # Keep files from earlier versions online, so browsers that still run an older
      # cached version can load their chunks instead of hanging on the spinner.
      - name: Eski versiya fayllarini saqlab qolish
        run: |
          find dist -name '*.map' -delete
          git fetch origin pages-history --depth=1 || true
          mkdir -p site
          if git rev-parse --verify -q origin/pages-history >/dev/null; then
            git --work-tree=site checkout origin/pages-history -- .
            git reset -q
          fi
          cp -a dist/. site/
          cd site
          git init -q
          git config user.name "dignets-bot"
          git config user.email "dignets-bot@users.noreply.github.com"
          git checkout -q -b pages-history
          git add -A
          git commit -q -m "Sayt: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" pages-history
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
